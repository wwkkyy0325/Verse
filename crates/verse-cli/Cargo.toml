[package]
name = "verse-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line interface for Verse"

[[bin]]
name = "verse"
path = "src/main.rs"

[dependencies]
verse-core.workspace = true
verse-audio.workspace = true
verse-model.workspace = true
verse-pipeline.workspace = true
# Where the cache and the output directory live. Named directly rather than
# reached through the pipeline, because the command has to resolve an output
# path whether or not anything is being recognised — and the pipeline does not
# re-export path resolution, which is not its business.
verse-store.workspace = true

# How much memory the machine has, for sizing the service's pool. The budget
# has to be a property of the machine rather than a constant: anchoring it to
# the 8 GB floor the project requires gave a machine with 31 GB the same pool as
# one with 8. Reading memory needs FFI on Windows and macOS, and this project
# forbids `unsafe` in its own code — so a crate that already does it, the way
# sherpa-onnx already does FFI, is the honest way to have a real number.
#
# `verse-core` is where the sizing *rule* lives and keeps its empty dependency
# list: the rule takes bytes, and this is what supplies them.
# `default-features = false` plus `system`: the defaults also carry disk,
# component, network and user, none of which this needs. `system` is the one
# that provides `System::total_memory`, and on Windows it is the one that pulls
# in `windows` and `ntapi`.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# The request line and the headers, for `verse serve`. Already in this
# workspace's build graph — Tauri's hyper stack uses it — so this adds a
# manifest line rather than a crate. It is used for the one genuinely fiddly
# part: parsing a head incrementally across reads. Hand-rolling that means
# re-deriving when a partial request becomes a complete one, which is exactly
# the kind of subtlety this project prefers to borrow rather than invent.
httparse = "1"

# The JSON report. Both are already in this workspace's build graph — the
# model catalogue and the window's bridge use them — so this adds a manifest
# line rather than a crate. Hand-rolling it would mean escaping quotes and
# control characters in Chinese transcripts by hand, which is the bug the
# report's contract tests exist to catch.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only the `transcribe` example reaches past the pipeline to an engine
# directly. The binary itself no longer names one.
[dev-dependencies]
verse-asr.workspace = true
