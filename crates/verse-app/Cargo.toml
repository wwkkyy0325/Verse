[package]
name = "verse-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop application for Verse"

[lib]
name = "verse_app"
path = "src/lib.rs"

[[bin]]
name = "verse-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
verse-core.workspace = true
verse-audio.workspace = true
verse-asr.workspace = true
verse-model.workspace = true
verse-pipeline.workspace = true
# Per-user directories and the result cache. Used directly because the window
# resolves where a transcript is saved, which is not the pipeline's business.
verse-store.workspace = true

tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
