<!-- The same mark as the application icon, at the size a browser tab needs.
     Generated by tools/make-icon.mjs for the executable; kept in step by
     hand, since the two are drawn at different sizes and the tab version
     wants fewer strokes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#2a6bf2"/>
  <g fill="#fff">
    <rect x="19" y="24" width="6" height="16" rx="3"/>
    <rect x="29" y="17" width="6" height="30" rx="3"/>
    <rect x="39" y="21" width="6" height="22" rx="3"/>
  </g>
</svg>
