<!-- Chinese is the interface language; English is a supported input language,
     not a UI language. The `dark` class is on the root element rather than
     resolved from the OS: dark is the default presentation, not a preference
     to be looked up. -->
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verse</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
