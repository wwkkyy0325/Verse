[workspace]
resolver = "2"
members = [
    "crates/verse-core",
    "crates/verse-audio",
    "crates/verse-asr",
    "crates/verse-model",
    "crates/verse-store",
    "crates/verse-pipeline",
    "crates/verse-cli",
    "crates/verse-app",
    "crates/verse-bench",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
verse-core = { path = "crates/verse-core" }
verse-audio = { path = "crates/verse-audio" }
verse-asr = { path = "crates/verse-asr" }
verse-model = { path = "crates/verse-model" }
verse-store = { path = "crates/verse-store" }
verse-pipeline = { path = "crates/verse-pipeline" }

# Pinned deliberately: the native library archive is version-locked to this
# version, so a bump means pre-staging a differently-named archive.
# See docs/llmwiki/design.md §7.2.
sherpa-onnx = "1.13.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
