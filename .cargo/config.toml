# VERSE_MODELS points a development build at this checkout's model directory.
# Without it the application looks beside its own executable, which during
# development is `target/debug/` — several levels from where the models are.
# An installed build has no such variable and uses the adjacent directory,
# which is the correct behaviour there. See ui-design.md §11.
#
# There is deliberately nothing else here.
#
# This file used to also set SHERPA_ONNX_ARCHIVE_DIR, pointing sherpa-onnx-sys
# at a prebuilt archive kept in `.sherpa-onnx-libs/` because GitHub is not
# reachable from mainland China. That made the repository un-buildable
# everywhere else: the crate treats a set-but-empty directory as an error
# rather than falling back to its own download, so a CI runner — which *can*
# reach GitHub — failed on all three platforms with "SHERPA_ONNX_ARCHIVE_DIR
# does not contain expected archive".
#
# It is a property of one machine's network, so it belongs in that machine's
# cargo config (`$CARGO_HOME/config.toml`), not in the repository. See
# docs/llmwiki/design.md §7.2.
[env]
VERSE_MODELS = { value = "models", relative = true }
