# What runs on every push and every pull request.
#
# **One job, on Windows, because Windows is what this ships for.** There were
# two: tests on Linux and a type-check on Windows. The Linux one went with the
# Linux release, and the reason is worth keeping, because it is easy to read
# the wrong thing into it.
#
# That job ran, and it failed — but not on the program. `bridge.rs` has a test
# that feeds `file_label` the path `C:\Users\someone\录音\第三季度会议.m4a` and
# asserts only the last component comes back. On Linux `Path::file_name()` does
# not treat `\` as a separator, so the whole string came back and the assertion
# fired. The function is portable; the test only asserts anything on Windows.
#
# So this is not "the code was Windows-only all along". It is that a second
# test platform is a second set of platform assumptions to keep true, and that
# cost was not worth paying for a platform nothing is released on.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: what matters is whether the tip is green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests and lints
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Not a dependency of *building* — a dependency of *testing*. The audio
      # tests skip themselves when ffmpeg is missing, which is honest and is
      # also less coverage than a developer gets. The step after this one is
      # what stops that from being invisible.
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress

      # A skip and a pass look the same in the test summary. This is the line
      # that says the audio tests had something to run.
      - name: ffmpeg is on PATH
        run: ffmpeg -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/verse-app/ui/package-lock.json

      - name: Frontend dependencies
        working-directory: crates/verse-app/ui
        run: npm ci

      - name: Frontend types
        working-directory: crates/verse-app/ui
        run: npm run check

      # The model weights are not in the repository and are not fetched here.
      # Tests that need them skip, which is why this can run at all.
      #
      # `--all-targets` via clippy below covers the test code too, so the
      # platform-specific arms in `reveal_in_folder` are all compiled.
      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
