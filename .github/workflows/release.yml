# Tag a commit `v0.1.0` and this builds the Windows installers and opens a
# draft release with them attached.
#
# ## Windows only
#
# **Two platforms were dropped, and neither for a reason that was a guess.**
#
# macOS: BtbN/FFmpeg-Builds publishes no darwin assets, the well-known macOS
# ffmpeg builds are GPL, and building from source would need an ad-hoc
# signature or Apple silicon refuses to execute the result. Three unusual
# problems for a platform this project has never been built on.
#
# Linux: it did build. `cargo test --workspace` compiled and ran on
# ubuntu-22.04, and the one failure was a test — `bridge.rs` passes a path
# written as `C:\Users\...`, which `Path::file_name()` does not split on Linux,
# so the whole string came back. That is a test that only asserts anything on
# Windows, not a program that only works on Windows.
#
# It was dropped anyway, as a scope decision: a Linux release is a second
# bundle layout to keep working, and the maintainer is shipping for Windows.
# Recorded here rather than in a commit message because the next person to
# consider a Linux build should know which of the two it was.
#
# ## ffmpeg is bundled, and that is what the licence section below is about
#
# The program invokes ffmpeg as a child process and never links it, which keeps
# its own code clear of ffmpeg's licence — but *distributing* a binary is a
# separate question from linking one, and a GPL build would carry the GPL's
# terms into this distribution. So the bundled ffmpeg is an LGPL build.
#
# **Nothing here is code-signed.** There is no Windows certificate in this
# repository, so the installers show a SmartScreen warning. That is a decision
# about accounts and money rather than about this file.

name: release

on:
  push:
    tags: ["v*"]
  # So a bundle can be tried without publishing anything. It really does not
  # publish, and that took a fix: `tagName` below is empty unless the ref is a
  # tag, because `github.ref_name` on a manual run of `main` is the string
  # "main", and the action would have created a release tagged `main`.
  workflow_dispatch:

permissions:
  contents: write

env:
  # The exact archive, not a pattern. BtbN rebuilds its `master` asset daily,
  # and "latest" is not a version for a licence notice to name — see
  # THIRD_PARTY_NOTICES.md.
  #
  # `n8.1` is one of BtbN's per-FFmpeg-release branches. A release branch is
  # the right kind of pin for something that parses untrusted media: it is a
  # nameable version, and it still takes patch releases. 8.1 is the line
  # closest to the 8.0.1 this project is developed against.
  FFMPEG_ASSET: ffmpeg-n8.1-latest-win64-lgpl-8.1.zip

jobs:
  bundle:
    name: windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The sidecar name carries the target triple, because the bundler strips
      # exactly that suffix on the way in: it copies
      # `ffmpeg-x86_64-pc-windows-msvc.exe` to `ffmpeg.exe` beside the program,
      # which is where `verse-audio` looks for it. Read out of `tauri-bundler`'s
      # `Settings::copy_binaries` rather than guessed — naming it `ffmpeg.exe`
      # here would install a file the config cannot resolve.
      - name: ffmpeg — the LGPL build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ffmpeg-bin
          curl -fsSL \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${FFMPEG_ASSET}" \
            -o ffmpeg.zip
          unzip -q ffmpeg.zip -d ffmpeg-unpacked
          find ffmpeg-unpacked -name ffmpeg.exe \
            -exec cp {} ffmpeg-bin/ffmpeg-x86_64-pc-windows-msvc.exe +
          ls -la ffmpeg-bin/

      # Declared here and not in `tauri.conf.json`, and the difference is not
      # stylistic: `tauri-build` validates `externalBin` from the *build
      # script*, so a committed entry naming a file that has not been fetched
      # fails `cargo check`, `cargo test` and every contributor's first build —
      # not only a bundle. Measured, by writing it into the config and watching
      # `cargo check` fail with "resource path ... does not exist".
      #
      # `--config` merges over the project's own file for this build alone.
      - name: Declare the bundled ffmpeg for this build
        shell: bash
        run: |
          cat > crates/verse-app/tauri.release.conf.json <<'JSON'
          {
            "bundle": {
              "externalBin": ["../../ffmpeg-bin/ffmpeg"]
            }
          }
          JSON

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/verse-app/ui/package-lock.json

      - name: Frontend dependencies
        working-directory: crates/verse-app/ui
        run: npm ci

      # sherpa-onnx-sys fetches its prebuilt static library from GitHub
      # Releases. That is reachable from a runner, so unlike a development
      # machine behind the Great Firewall this needs no staged archive — and the
      # repository's `.cargo/config.toml` deliberately does not point at one,
      # because setting SHERPA_ONNX_ARCHIVE_DIR to a directory without the
      # archive in it is a hard error rather than a fallback.
      - name: Build and attach
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The Tauri project is not at the repository root.
          projectPath: crates/verse-app
          # Merged over the project's config, so the sidecar is declared for a
          # release and not for anybody's first `cargo test`.
          args: --config tauri.release.conf.json
          # Empty on a manual run, so nothing is created and nothing is
          # uploaded; the action still builds. See the `workflow_dispatch`
          # comment at the top.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Verse ${{ github.ref_name }}
          releaseBody: |
            Offline Chinese speech-to-text. Recognition runs locally; nothing is
            uploaded and nothing connects out.

            **These builds are not code-signed.** Windows will show a
            SmartScreen warning.

            ffmpeg is bundled — an LGPL build; see THIRD_PARTY_NOTICES.md for
            which one and where its source is.

            The model weights are not bundled. The first run offers to fetch the
            default one, 228 MB.
          releaseDraft: true
          prerelease: false
